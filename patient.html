<script>
  document.getElementById("searchField").addEventListener("keyup", function () {
    const searchTerm = this.value;

    if (searchTerm.length > 0) {
        fetch('fetchData.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `searchTerm=${encodeURIComponent(searchTerm)}`
        })
        .then(response => response.json())
        .then(data => {
            const resultList = document.getElementById("resultList");
            resultList.innerHTML = '';

            if (data.error) {
                const errorItem = document.createElement("div");
                errorItem.textContent = data.error;
                errorItem.style.color = "red";
                resultList.appendChild(errorItem);
                resultList.style.display = "block";
            } else {
                data.forEach(item => {
                    const listItem = document.createElement("div");
                    listItem.textContent = `${item.FirstName} ${item.LastName}`;
                    listItem.dataset.id = item.id; 
                    listItem.style.padding = "8px";
                    listItem.style.cursor = "pointer";
                    listItem.style.borderBottom = "1px solid #ccc"; 
                    listItem.addEventListener("click", () => {
                        autocompleteSearchBox(item); 
                        populateForm(item); 
                        resultList.style.display = "none";
                    });
                    resultList.appendChild(listItem); 
                });

                resultList.style.display = "block";
            }
        })
        .catch(error => console.error('Error:', error));
    } else {
        const resultList = document.getElementById("resultList");
        resultList.innerHTML = '';
        resultList.style.display = "none";
    }
});

function autocompleteSearchBox(data) {
    const searchField = document.getElementById("searchField");
    searchField.value = `${data.FirstName} ${data.LastName}`;
}

function populateForm(data) {
    document.getElementById("firstName").value = data.FirstName;
    document.getElementById("lastName").value = data.LastName;
    document.getElementById("phoneNumber").value = data.PhoneNumber;
    document.getElementById("dob").value = data.Date_of_Birth;
    document.getElementById("age").value = data.Age;
    document.getElementById("gender").value = data.Gender;
}


</script>
