<script>
    function calculateAge() {
        const dobInput = document.getElementById('dob').value;
        const dob = new Date(dobInput);
        const today = new Date();

        let age = today.getFullYear() - dob.getFullYear();

        const monthDifference = today.getMonth() - dob.getMonth();
        const dayDifference = today.getDate() - dob.getDate();
        if (monthDifference < 0 || (monthDifference === 0 && dayDifference < 0)) {
            age--;
        }
        document.getElementById('age').value = age;

    }
    document.querySelector('.searchBar input').addEventListener('input', function () {
    const searchValue = this.value;

    fetch(`fetchData.php?search=${searchValue}`)
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                alert(data.error);
            } else {
                document.querySelector("input[name='fname']").value = data.fname;
                document.querySelector("input[name='lname']").value = data.lname;
                document.querySelector("input[name='Phone_number']").value = data.phone_number;
            }
        })
        .catch(error => console.error('Error fetching data:', error));
});
</script>
