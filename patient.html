<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="form.css">

</head>

<body>
    <h1>Hospital Management system</h1>
    <div class="topNavbar">
        <h2 style="margin-left: 30px;">Add New Patient Enrollement</h2>
        <a href="http://localhost:8080/Hospital%20Management/HMS-Crud/view.php"><button type="submit"
            class="btn btn-primary mb-3">All List</button></a></div>
    <div class="container">
        <form action="submit.php" method="post">
            <div class="form">
                <div class="row">
                    <div class="mb-3 col">
                        <label class="form-label">Patient First Name</label>
                        <input type="text" class="form-control" name="fname" placeholder="Enter Firstname" required>
                    </div>
                    <div class="mb-3 col">
                        <label class="form-label">LastName</label>
                        <input type="text" class="form-control" name="lname" placeholder="Enter Lastname" required>
                    </div>
                    <div class="mb-3 col">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" name="Phone_number" id="phoneNumber"
                            placeholder="Phone Number" maxlength="10" required>
                    </div>

                </div>
                <div class="row">
                    <div class="mb-3 col">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" class="form-control" name="DOB" id="dob" onchange="calculateAge()"
                            placeholder="Date of Birth" required>
                    </div>
                    <div class="mb-3 col">
                        <label class="form-label">Age</label>
                        <input type="number" class="form-control" name="Age" id="age" placeholder="Enter Your Age"
                            required>
                    </div>
                    <div class="mb-3 col">
                        <label class="form-label">Gender</label>
                        <select name="select" class="form-select" required>
                            <option selected>Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                </div>
                <div class="row">
                    <div class="mb-3 col">
                        <label class="form-label"> Name of Decease</label>
                        <input type="text" class="form-control" name="Name_of_Decease" placeholder="Enter Decease Name"
                            required>
                    </div>
                    <div class="mb-3 col">
                        <label class="form-label">Date of illness</label>
                        <input type="date" class="form-control" name="DateOfillness" placeholder="Date of illness"
                            required>
                    </div>
                    <div class="mb-3 col">
                        <label class="form-label">City</label>
                        <input type="text" class="form-control" name="City" placeholder="City Name" required>
                    </div>
                </div>
                <div class="row">
                    <div class="mb-3 col">
                        <label class="form-label">District</label>
                        <input type="text" class="form-control" name="District" placeholder="District Name" required>
                    </div>
                    <div class="mb-3 col">
                        <label class="form-label">State</label>
                        <input type="text" class="form-control" name="State" placeholder="State Name" required>
                    </div>
                    <div class="mb-3 col">
                        <label class="form-label">Country</label>
                        <input type="text" class="form-control" name="Country" placeholder="Country Name" required>
                    </div>
                </div>
                <div class="row">
                    <div class="mb-3 col">
                        <label class="form-label">Maritial Status</label>
                        <select name="Maritial_Status" class="form-select" required>
                            <option selected>Select...</option>
                            <option value="Married">Married</option>
                            <option value="Single">Single</option>
                        </select>
                    </div>
                    <div class="mb-3 col">
                        <label class="form-label">Parents Name</label>
                        <input type="text" class="form-control" name="Parents_Name" placeholder="Enter Parents Name"
                            required>
                    </div>
                    <div class="mb-3 col">
                        <label class="form-label">phone number</label>
                        <input type="tel" class="form-control" name="Parent_Phone_number" id="parentPhone"
                            placeholder="Parents Phone Number" maxlength="10" required>
                    </div>
                </div>
                <div class="row">
                    <div class="mb-3 col">
                        <label class="form-label">Emergency Contact Person</label>
                        <input type="text" class="form-control" name="Emergency_Contact_Person"
                            placeholder="Enter Person Name" required>
                    </div>
                    <div class="mb-3 col">
                        <label class="form-label">relationship</label>
                        <input type="text" class="form-control" name="Relationship" placeholder="Enter Relationship"
                            required>
                    </div>
                    <div class="mb-3 col">
                        <label class="form-label">Contact Number</label>
                        <input type="tel" class="form-control" name="Contact_Number" id="EmContact"
                            placeholder="Enter Contact Number" maxlength="10" required>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col text-center">
                    <button type="submit" class="btn btn-primary mt-3">Submit</button>
                </div>

            </div>
        </form>

        <br>

    </div>

</body>
<script>
    function calculateAge() {
        const dobInput = document.getElementById('dob').value;
        const dob = new Date(dobInput);
        const today = new Date();

        let age = today.getFullYear() - dob.getFullYear();

        const monthDifference = today.getMonth() - dob.getMonth();
        const dayDifference = today.getDate() - dob.getDate();
        if (monthDifference < 0 || (monthDifference === 0 && dayDifference < 0)) {
            age--;
        }
        document.getElementById('age').value = age;

    }
</script>

</html>
